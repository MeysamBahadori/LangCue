name: Windows installer and first pre-release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: langcue-first-pre-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build and publish Windows x64 (self-contained)
        shell: pwsh
        run: |
          dotnet restore LangCue.slnx
          dotnet build LangCue.slnx --configuration Release --no-restore
          dotnet publish src/LangCue/LangCue.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            --output artifacts/publish/win-x64
      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            $iscc = (Get-Command ISCC.exe -ErrorAction Stop).Source
          }
          & $iscc 'installer/LangCue.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
          if (-not (Test-Path 'artifacts/installer/LangCue-Setup-0.2.0-preview.2-win-x64.exe')) {
            throw 'Expected installer was not generated'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: LangCue-Setup-0.2.0-preview.2-win-x64
          path: artifacts/installer/LangCue-Setup-0.2.0-preview.2-win-x64.exe
          if-no-files-found: error
      - name: Create initial GitHub pre-release and attach installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $tag = 'v0.2.0-preview.2'
          $installer = 'artifacts/installer/LangCue-Setup-0.2.0-preview.2-win-x64.exe'
          gh release view $tag --repo $env:GH_REPO *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; leaving its original artifact unchanged."
            exit 0
          }
          gh release create $tag $installer `
            --repo $env:GH_REPO `
            --target $env:GITHUB_SHA `
            --title 'LangCue 0.2.0-preview.2' `
            --prerelease `
            --notes-file 'docs/release-notes-v0.2.0-preview.2.md'
          if ($LASTEXITCODE -ne 0) { throw "Could not create GitHub release: $LASTEXITCODE" }
